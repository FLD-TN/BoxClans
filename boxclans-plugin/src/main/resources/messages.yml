# BoxClans — messages.yml
# Mọi tin nhắn của plugin. Chấp nhận &c, &#RRGGBB và MiniMessage (<gradient:#FF0000:#FFAA00>...</gradient>).
# Một tin nhắn có hai kênh:
#   <khoá>:
#     chat: { enabled: true, text: '...' }        # text có thể là danh sách nhiều dòng; prefix: false để bỏ prefix
#     actionbar: { enabled: false, text: '...' }
# Placeholder dạng %ten%. Tên clan (%clan%) luôn giữ màu của clan.
# Thiếu khoá nào thì lấy bản mặc định trong jar. /clanadmin reload để nạp lại.

config-version: 1
# Không sửa dòng này. Khi bản mới của plugin có text-version cao hơn, file này được chuyển vào
# old-configs/ và thay bằng bản mới (để cập nhật chữ). Sửa xong muốn giữ thì đừng hạ số này.
