# BoxClans — icons.yml: icon khiên động của bang hội (Cửa hàng bang hội, /clanadmin icon)
# Icon là font image của ItemsAdder (pack 'shieldranks', chép vào plugins/ItemsAdder/contents/ rồi /iazip).
# Placeholder:
#   %boxclans_icon%         icon động (đổi khung theo frame-interval-ms), dùng cho tab / scoreboard / nametag
#   %boxclans_icon_static%  icon tĩnh, dùng cho chat (tin nhắn chat không chuyển động được)
#   %boxclans_icon_id%      id icon đang dùng, 'none' nếu chưa có
#   %boxclans_top_<n>_icon%, %boxclans_clan_<mã bang hội>_icon%
# Clan không có icon: hai placeholder icon trả về rỗng hoàn toàn (không có khoảng trắng).
# Có icon: placeholder trả về icon + 1 khoảng trắng, nên viết liền: [%boxclans_icon%%boxclans_name%]

# Không sửa dòng này (xem giải thích trong menus/clan-detail.yml)
text-version: 3

# Icon cho clan mới tạo: id trong 'icons' bên dưới, hoặc none
default-icon: none

# Mỗi khung hình đứng bao lâu (ms, tối thiểu 50). 100 = đúng tốc độ GIF gốc; 200 = chậm gấp đôi, nhẹ mạng hơn.
# Nhớ đặt '%boxclans_icon%' trong placeholder-refresh-intervals của TAB bằng đúng số này.
frame-interval-ms: 100

# <id>:
#   display: tên hiển thị (tên item trong cửa hàng, %icon% trong tin nhắn)
#   frames: số khung hình
#   glyph: font image ItemsAdder của từng khung, {frame} = 1..frames
#   static: font image cho chat
#   menu-item: item ItemsAdder trong shop (texture động); không có thì dùng fallback-material
#   default-owned: true = mọi bang hội đều có sẵn, chọn trong Cài đặt > Icon bang hội, không bán trong cửa hàng
#   price: giá Minh Huy trong Cửa hàng bang hội (icon không default-owned). 0 = nhận miễn phí trong cửa hàng
#          Giá mặc định chỉ là gợi ý, chỉnh lại theo kinh tế của server.
#   permission: để trống = bang nào cũng mua được; có thì người mua (Minh Chủ / Phó Bang) cần quyền này
icons:
  blank_silver:
    display: '&#BBBBBBKhiên Bạc'
    frames: 25
    glyph: 'shieldranks:blank_silver_{frame}'
    static: 'shieldranks:blank_silver_static'
    menu-item: 'shieldranks:blank_silver_item'
    fallback-material: IRON_INGOT
    price: 0
    default-owned: true
    permission: ''
